<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            background-color: #ffe4e1;
            font-family: "Times New Roman", serif;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-top: 0px;
        }

        form {
            width: 750px;
            margin: auto;
        }

        table {
            width: 100%;
            border-spacing: 0 12px;
        }

        td:first-child {
            width: 170px;
            font-size: 17px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 390px;
            height: 20px;
        }

        input[type="number"] {
            width: 390px;
            height: 20px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        select {
            width: 405px;
            height: 22px;
        }

        textarea {
            width: 390px;
            height: 80px;
        }

        input[type="file"] {
            width: 300px;
        }

        .small {
            width: 55px !important;
        }

        .year {
            width: 90px !important;
        }

        .mobile {
            width: 330px !important;
        }

        .register {
            text-align: center;
        }

        .register input {
            padding: 3px 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>

        <table>

            <tr>
                <td>Roll no. :</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Student name :</td>
                <td>
                    <input type="text" placeholder="First Name" style="width:180px;">
                    -
                    <input type="text" placeholder="Last Name" style="width:180px;">
                </td>
            </tr>

            <tr>
                <td>Father's name :</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Date of birth :</td>
                <td>
                    <input type="text" placeholder="Day" class="small">
                    -
                    <input type="text" placeholder="Month" class="small">
                    -
                    <input type="text" placeholder="Year" class="year">
                    <i>(DD-MM-YYYY)</i>
                </td>
            </tr>

            <tr>
                <td>Mobile no. :</td>
                <td>
                    <input type="text" value="+91" style="width:40px;">
                    -
                    <input type="text" class="mobile">
                </td>
            </tr>

            <tr>
                <td>Email id :</td>
                <td>
                    <input type="email">
                </td>
            </tr>

            <tr>
                <td>Password :</td>
                <td>
                    <input type="password">
                </td>
            </tr>

            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox"> CSE
                    <input type="checkbox"> IT
                    <input type="checkbox"> ECE
                    <input type="checkbox"> Civil
                    <input type="checkbox"> Mech
                </td>
            </tr>

            <tr>
                <td>Course :</td>
                <td>
                    <select>
                        <option>---------------- Select Current Course's ----------------</option>
                        <option>B.Tech</option>
                        <option>BCA</option>
                        <option>B.Sc</option>
                        <option>M.Tech</option>
                        <option>MCA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Student photo :</td>
                <td>
                    <input type="file">
                </td>
            </tr>

            <tr>
                <td>City :</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Address :</td>
                <td>
                    <textarea></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" class="register">
                    <input type="submit" value="Register">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
